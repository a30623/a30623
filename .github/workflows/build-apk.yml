name: Build Android APK

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/人猴快乐器.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: renhou-happy-apk
          path: app/build/outputs/apk/debug/人猴快乐器.apk
          if-no-files-found: error
