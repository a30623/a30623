name: Build Android APK

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/人猴快乐器_兼容版.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: renhou-compat-apk
          path: app/build/outputs/apk/debug/人猴快乐器_兼容版.apk
          if-no-files-found: error
